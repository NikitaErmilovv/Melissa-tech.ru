# Деплой на VPS (Caddy) после push в master.
# Secrets (optional if .github/vps-deploy-key exists): DEPLOY_SSH_KEY, DEPLOY_HOST, DEPLOY_PATH
name: Deploy melissa-tech.ru (rsync)

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  rsync:
    runs-on: ubuntu-latest
    env:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY || secrets.SSH_PRIVATE_KEY || secrets.SSH_KEY }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve deploy target
        id: target
        run: |
          set -euo pipefail
          HOST="${DEPLOY_HOST:-root@185.84.163.45}"
          REMOTE="${DEPLOY_PATH:-/var/www/melissa-tech.ru}"
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "remote=$REMOTE" >> "$GITHUB_OUTPUT"
          if [ -z "${DEPLOY_SSH_KEY:-}" ] && [ ! -f .github/vps-deploy-key ]; then
            echo "::error::Нужен Actions secret DEPLOY_SSH_KEY (приватный SSH-ключ VPS) или файл .github/vps-deploy-key в репозитории."
            exit 1
          fi
      - name: Install SSH key
        run: |
          install -m 700 -d ~/.ssh
          if [ -n "${DEPLOY_SSH_KEY:-}" ]; then
            printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          else
            cp .github/vps-deploy-key ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ steps.target.outputs.host }}" >> ~/.ssh/known_hosts 2>/dev/null || true
      - name: Rsync site to server
        run: |
          rsync -az --delete --exclude '.git' --exclude '.github' \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            ./ "${{ steps.target.outputs.host }}:${{ steps.target.outputs.remote }}/"
      - name: Verify aliento deploy marker
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "${{ steps.target.outputs.host }}" \
            "head -4 '${{ steps.target.outputs.remote }}/aliento/deploy-version.txt'"
