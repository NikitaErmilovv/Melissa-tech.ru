# Деплой на VPS (Caddy) после push в master.
# Repository secret: DEPLOY_SSH_KEY = приватный OpenSSH-ключ для root@185.84.163.45
# (не путать с Deploy keys репозитория для git clone).
# Опционально: DEPLOY_SSH_KEY_B64 (тот же ключ в base64 одной строкой), DEPLOY_HOST, DEPLOY_PATH
name: Deploy melissa-tech.ru (rsync)

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  rsync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve deploy target and install SSH key
        id: setup
        env:
          SEC_DEPLOY: ${{ secrets.DEPLOY_SSH_KEY }}
          SEC_SSH: ${{ secrets.SSH_PRIVATE_KEY }}
          SEC_KEY: ${{ secrets.SSH_KEY }}
          SEC_VPS: ${{ secrets.VPS_SSH_KEY }}
          SEC_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          HOST="${DEPLOY_HOST:-root@185.84.163.45}"
          REMOTE="${DEPLOY_PATH:-/var/www/melissa-tech.ru}"
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "remote=$REMOTE" >> "$GITHUB_OUTPUT"

          install -m 700 -d ~/.ssh
          KEY=""
          for candidate in "$SEC_DEPLOY" "$SEC_SSH" "$SEC_KEY" "$SEC_VPS"; do
            if [ -n "$candidate" ]; then
              KEY="$candidate"
              break
            fi
          done

          if [ -n "${SEC_B64:-}" ]; then
            printf '%s' "$SEC_B64" | tr -d '\n' | base64 -d > ~/.ssh/deploy_key
          elif [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          elif [ -f .github/vps-deploy-key ]; then
            cp .github/vps-deploy-key ~/.ssh/deploy_key
          else
            echo "Проверка секретов (только длина, без значений):"
            for name in SEC_DEPLOY SEC_SSH SEC_KEY SEC_VPS SEC_B64; do
              eval "v=\${$name:-}"
              if [ -n "$v" ]; then echo "  $name: задан (${#v} символов)"; else echo "  $name: пусто"; fi
            done
            if [ -f .github/vps-deploy-key ]; then echo "  .github/vps-deploy-key: есть"; else echo "  .github/vps-deploy-key: нет"; fi
            echo "::error::Нет ключа для VPS. Repository secret DEPLOY_SSH_KEY = приватный OpenSSH-ключ для root@185.84.163.45 (BEGIN/END). Deploy key репозитория (git) — не подходит. Org secrets: разрешите доступ репозиторию Melissa-tech.ru."
            exit 1
          fi
          chmod 600 ~/.ssh/deploy_key
          H="${HOST#*@}"
          ssh-keyscan -H "$H" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Rsync site to server
        run: |
          rsync -az --delete --exclude '.git' --exclude '.github' \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            ./ "${{ steps.setup.outputs.host }}:${{ steps.setup.outputs.remote }}/"

      - name: Verify deploy markers on server
        run: |
          REMOTE="${{ steps.setup.outputs.remote }}"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            "${{ steps.setup.outputs.host }}" \
            "head -4 '$REMOTE/pervushin-avtokompleks-ekaterinburg/deploy-version.txt'; grep -c '\"files\"' '$REMOTE/pervushin-avtokompleks-ekaterinburg/data/gallery-manifest.json' || true"
