# Деплой на VPS (Caddy) после push в master.
# Repository secret: DEPLOY_SSH_KEY (или DEPLOY_SSHK) — приватный OpenSSH для root@185.84.163.45
name: Deploy melissa-tech.ru (rsync)

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  rsync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve deploy target and install SSH key
        id: setup
        env:
          SEC_DEPLOY: ${{ secrets.DEPLOY_SSH_KEY }}
          SEC_DEPLOYSHK: ${{ secrets.DEPLOY_SSHK }}
          SEC_SSH: ${{ secrets.SSH_PRIVATE_KEY }}
          SEC_KEY: ${{ secrets.SSH_KEY }}
          SEC_VPS: ${{ secrets.VPS_SSH_KEY }}
          SEC_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          HOST="${DEPLOY_HOST:-root@185.84.163.45}"
          REMOTE="${DEPLOY_PATH:-/var/www/melissa-tech.ru}"
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "remote=$REMOTE" >> "$GITHUB_OUTPUT"

          install -m 700 -d ~/.ssh
          KEY=""
          for candidate in "$SEC_DEPLOY" "$SEC_DEPLOYSHK" "$SEC_SSH" "$SEC_KEY" "$SEC_VPS"; do
            if [ -n "$candidate" ]; then
              KEY="$candidate"
              break
            fi
          done

          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/deploy_key
          elif [ -n "${SEC_B64:-}" ]; then
            printf '%s' "$SEC_B64" | tr -d '\n\r' | base64 -d > ~/.ssh/deploy_key
          elif [ -f .github/vps-deploy-key ]; then
            cp .github/vps-deploy-key ~/.ssh/deploy_key
          else
            echo "Проверка секретов (только длина):"
            for name in SEC_DEPLOY SEC_DEPLOYSHK SEC_SSH SEC_KEY SEC_VPS SEC_B64; do
              eval "v=\${$name:-}"
              if [ -n "$v" ]; then echo "  $name: задан (${#v} символов)"; else echo "  $name: пусто"; fi
            done
            echo "::error::Actions не видит ключ. Repository secret: имя DEPLOY_SSH_KEY (или DEPLOY_SSHK), значение — приватный ключ BEGIN/END для root@185.84.163.45. Org secret — включите доступ репозиторию Melissa-tech.ru."
            exit 1
          fi
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1; then
            echo "::error::Секрет не похож на приватный OpenSSH-ключ (проверьте BEGIN/END и переносы строк)."
            exit 1
          fi
          H="${HOST#*@}"
          ssh-keyscan -H "$H" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Rsync site to server
        run: |
          rsync -az --delete --exclude '.git' --exclude '.github' \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            ./ "${{ steps.setup.outputs.host }}:${{ steps.setup.outputs.remote }}/"

      - name: Verify deploy markers on server
        run: |
          REMOTE="${{ steps.setup.outputs.remote }}"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            "${{ steps.setup.outputs.host }}" \
            "grep deploy-trigger '$REMOTE/fantastika-home174-lazurny/deploy-version.txt' | tail -1"
