# Деплой на VPS (Caddy) после push в master.
# Secrets: DEPLOY_HOST (root@185.84.163.45), DEPLOY_PATH, DEPLOY_SSH_KEY
name: Deploy melissa-tech.ru (rsync)

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  rsync:
    runs-on: ubuntu-latest
    env:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@v4
      - name: Install SSH key
        if: env.DEPLOY_SSH_KEY != ''
        run: |
          install -m 600 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${DEPLOY_HOST#*@}" >> ~/.ssh/known_hosts 2>/dev/null || true
      - name: Rsync site to server
        if: env.DEPLOY_SSH_KEY != ''
        run: |
          rsync -az --delete --exclude '.git' --exclude '.github' \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            ./ "${DEPLOY_HOST}:${DEPLOY_PATH}/"
