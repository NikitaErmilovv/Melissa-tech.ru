# Раз в ~2 суток подтягивает отзывы и цифры 2ГИС в data/*.json и пушит в master.
# Сайт остаётся статикой: только обновляются JSON-файлы.
name: Sync 2GIS reviews

on:
  schedule:
    # 03:00 UTC ≈ 10:00 Новосибирск; раз в 2 календарных дня
    - cron: "0 3 */2 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and write JSON
        run: python3 scripts/sync_2gis_reviews.py --force
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reviews-2gis.json data/2gis-meta.json
          if git diff --staged --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Sync 2GIS reviews and rating (automated)"
          git push
