<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="melissa-tech.ru">
<title>melissa-tech.ru</title>
<style>
  :root {
    --accent: #DBDFFD;
    --bg: #0a0a0b;
    --text: #f4f4f5;
    --muted: #9ca3af;
    --border: rgba(255, 255, 255, 0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .glow {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse 60% 40% at 50% -10%, rgba(219, 223, 253, 0.12), transparent),
      radial-gradient(ellipse 40% 30% at 100% 100%, rgba(219, 223, 253, 0.06), transparent);
  }

  .wrap {
    position: relative;
    max-width: 480px;
    padding: 48px 24px;
    text-align: center;
  }

  .kicker {
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 20px;
  }

  h1 {
    font-size: clamp(1.75rem, 5vw, 2.25rem);
    font-weight: 600;
    letter-spacing: -0.03em;
    line-height: 1.15;
    margin-bottom: 16px;
  }

  h1 span { color: var(--accent); }

  .intro {
    color: var(--muted);
    font-size: 1rem;
    line-height: 1.6;
  }

  .note {
    margin-top: 32px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    font-size: 0.85rem;
    color: var(--muted);
  }

  .contacts {
    margin-top: 28px;
    text-align: center;
    font-size: 0.9rem;
    color: var(--muted);
    line-height: 1.65;
  }

  .contacts .who {
    color: var(--text);
    font-weight: 600;
    margin-bottom: 2px;
  }

  .phone {
    display: inline-block;
    margin: 10px 0 12px;
    color: var(--text);
    font-size: 1.15rem;
    font-weight: 600;
    letter-spacing: -0.02em;
    text-decoration: none;
  }

  .phone:hover { color: var(--accent); }
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<main class="wrap">
  <p class="kicker">melissa-tech.ru</p>
  <h1>Персональный <span>доступ</span></h1>
  <p class="intro">Демо-версия сайта доступна только по индивидуальной ссылке от менеджера.</p>
  <p class="note">Если вы получили ссылку — откройте её напрямую. Список проектов на этой странице не публикуется.</p>
  <div class="contacts">
    <p class="who">ИП Переверзев Артём К.</p>
    <p>ИНН 220911551579</p>
    <p>ОГРНИП 325220200012522</p>
    <a class="phone" href="tel:+79021404116">+7 902 140-41-16</a>
  </div>
</main>
</body>
</html>
