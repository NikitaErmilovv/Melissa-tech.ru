# Фрагмент для /opt/Melissa-Tech/deploy/nginx.conf — сервис wb-print.
# Добавьте wb-print.tw1.ru в server_name первого HTTP-блока (редирект crm/billing).

server {
  listen 80;
  server_name wb-print.tw1.ru;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name wb-print.tw1.ru;

  ssl_certificate /etc/letsencrypt/live/wb-print.tw1.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/wb-print.tw1.ru/privkey.pem;

  client_max_body_size 128m;

  location / {
    proxy_pass http://wb-print:8341;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 300s;
  }
}